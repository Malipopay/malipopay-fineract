# Watch apache/fineract for a new release and open a pull request when one appears.
#
# The fork's branch model:
#   develop     an untouched mirror of upstream, so the diff against upstream is readable
#   malipopay   the release tag this deployment runs, plus the deploy/ tree and these
#               workflows, and nothing else
#
# Upstream source files are never edited on malipopay. That is what keeps this merge small:
# customisation belongs in custom/malipopay/ modules or on the /app/plugins classpath, both
# of which upstream designed so that forks stay easy to sync.
#
# This workflow does not merge anything by itself. Upgrading a core banking system is a
# decision with a maintenance window, a database snapshot and a migration that cannot be
# undone, so it opens a pull request and stops.

name: Check upstream Fineract releases

on:
  schedule:
    - cron: '0 6 * * 1'      # Monday morning, East Africa time is +3
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the malipopay branch
        uses: actions/checkout@v4
        with:
          ref: malipopay
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/apache/fineract.git || true
          git fetch upstream --tags --quiet
          git remote -v

      - name: Compare the newest upstream release with the pinned one
        id: compare
        run: |
          PINNED="$(cat deploy/UPSTREAM_VERSION)"
          # Releases are numbered 1.x.y. Sort by version, not lexically, or 1.9.0 beats 1.15.0.
          LATEST="$(git tag -l '1.*' | grep -E '^1\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "pinned=$PINNED"  >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"  >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Pinned at $PINNED, which is the newest release. Nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Newest release is $LATEST, this fork is pinned at $PINNED."
          fi

      - name: Gather what changed
        if: steps.compare.outputs.up_to_date == 'false'
        id: detail
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          # The two facts that decide whether this upgrade is routine or a project: the Java
          # version and the count of database changesets.
          OLD_JAVA="$(git show "${PINNED}:build.gradle" | grep -o 'JavaLanguageVersion.of([0-9]*)' | head -1 || echo unknown)"
          NEW_JAVA="$(git show "${LATEST}:build.gradle" | grep -o 'JavaLanguageVersion.of([0-9]*)' | head -1 || echo unknown)"
          CHANGESETS="$(git diff --name-only "${PINNED}...${LATEST}" -- '*/db/changelog/*' | wc -l | tr -d ' ')"
          COMMITS="$(git rev-list --count "${PINNED}..${LATEST}")"
          {
            echo "old_java=$OLD_JAVA"
            echo "new_java=$NEW_JAVA"
            echo "changesets=$CHANGESETS"
            echo "commits=$COMMITS"
          } >> "$GITHUB_OUTPUT"

      - name: Open the upgrade pull request
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          BRANCH="upstream/${LATEST}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "A branch for ${LATEST} already exists. Nothing to open."
            exit 0
          fi
          git config user.name  "malipopay-bot"
          git config user.email "engineering@lockwood.co.tz"
          git checkout -b "$BRANCH"
          echo "$LATEST" > deploy/UPSTREAM_VERSION
          git add deploy/UPSTREAM_VERSION
          git commit -m "chore(cbs): pin upstream Fineract ${LATEST}"

          # Merge the release tag. A conflict here means someone edited an upstream file on
          # this branch, which the branch model forbids; the pull request will say so.
          if ! git merge --no-edit "$LATEST"; then
            git merge --abort
            git commit --allow-empty -m "chore(cbs): upstream ${LATEST} does not merge cleanly"
            CONFLICT=" **The merge did not apply cleanly.** Someone has edited an upstream file on this branch. Resolve by hand and record why."
          fi
          git push origin "$BRANCH"

          cat > /tmp/body.md <<BODY
          Apache Fineract **${LATEST}** is out. This branch is pinned at **${PINNED}**.

          | | value |
          |---|---|
          | commits between the two | ${{ steps.detail.outputs.commits }} |
          | database changesets touched | ${{ steps.detail.outputs.changesets }} |
          | Java, pinned release | ${{ steps.detail.outputs.old_java }} |
          | Java, new release | ${{ steps.detail.outputs.new_java }} |

          Release notes: https://github.com/apache/fineract/releases/tag/${LATEST}
          ${CONFLICT:-}

          ## Before merging

          - [ ] Read the release notes end to end, including anything marked not ready for production.
          - [ ] If the Java version changed, update it in \`.github/workflows/malipopay-docker-build.yml\`.
          - [ ] If database changesets moved, plan a maintenance window. Liquibase migrations are forward only and there is no downgrade path.
          - [ ] Build the image: tag \`mp/${LATEST}-mp.1\`.
          - [ ] Deploy to UAT with \`deploy/scripts/upgrade.sh uat\`, then run \`deploy/scripts/proof.sh uat\` and read the output.
          - [ ] Let one close-of-business run complete on UAT before going near production.
          BODY
          gh pr create --base malipopay --head "$BRANCH" \
            --title "Upstream Fineract ${LATEST} is available (pinned: ${PINNED})" \
            --body-file /tmp/body.md
